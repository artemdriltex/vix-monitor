name: relay

# Самонаводящаяся эстафета: сама вычисляет, когда рынок, и будит market-loop.
# Запускать можно когда угодно и кем угодно — она сориентируется.
# Аварийные падения ловит guardian.yml и перезапускает эстафету.
on:
  workflow_dispatch: {}

permissions:
  actions: write

concurrency:
  group: relay
  cancel-in-progress: true

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Сориентироваться и передать эстафету
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT || github.token }}
          REPO: ${{ github.repository }}
        run: |
          # торговое окно: пн-пт 8:55–15:55 по Нью-Йорку (перевод часов учитывается сам)
          in_window() {
            local dow=$(TZ=America/New_York date +%u) hm=$((10#$(TZ=America/New_York date +%H%M)))
            [ "$dow" -le 5 ] && [ "$hm" -ge 855 ] && [ "$hm" -lt 1555 ]
          }
          next_open() {  # unix-время ближайшего открытия (8:55 ET торгового дня)
            python3 -c "
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          ny = ZoneInfo('America/New_York')
          now = datetime.now(ny)
          d = now.date()
          t = datetime(d.year, d.month, d.day, 8, 55, tzinfo=ny)
          if now >= t or d.weekday() > 4:
              d += timedelta(days=1)
              while d.weekday() > 4:
                  d += timedelta(days=1)
              t = datetime(d.year, d.month, d.day, 8, 55, tzinfo=ny)
          print(int(t.timestamp()))"
          }
          if in_window; then
            echo "Рынок открыт — бужу market-loop"
            gh workflow run market-loop --repo "$REPO"
            exit 0
          fi
          TARGET=$(next_open)
          NOW=$(date -u +%s)
          LIMIT=$((NOW + 20100))
          if [ "$TARGET" -lt "$LIMIT" ]; then SLEEP_UNTIL=$TARGET; else SLEEP_UNTIL=$LIMIT; fi
          echo "Сейчас $NOW, открытие $TARGET, сплю $(( (SLEEP_UNTIL-NOW)/60 )) мин"
          while [ "$(date -u +%s)" -lt "$SLEEP_UNTIL" ]; do sleep 60; done
          if [ "$(date -u +%s)" -ge "$TARGET" ]; then
            echo "Открытие — бужу market-loop"
            gh workflow run market-loop --repo "$REPO"
          else
            echo "Ещё ночь — следующий прыжок"
            gh workflow run relay --repo "$REPO"
          fi
